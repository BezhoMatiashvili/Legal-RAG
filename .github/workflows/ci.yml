name: CI

on:
  push:
    branches: [main, dev, master]
  pull_request:
    branches: [main, dev, master]

permissions:
  contents: read

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.2"
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --dev
      - run: uv run ruff check run_all.py scraper tests
      - run: uv run pytest -q tests

  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.2"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run python scripts/gen_code_map.py --check
      - run: uv run pytest -q -m "not snapshot"
        env:
          RERANK_ENABLED: "false"
