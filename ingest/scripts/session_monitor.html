<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Sessions & RAG Monitor</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2b3440;
    --fg:#e6edf3; --dim:#8b98a5; --faint:#5b6570;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; --purple:#bc8cff;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  a{color:var(--blue)}
  .wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12.5px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 2s infinite}
  .dot.off{background:var(--red);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.5)}70%{box-shadow:0 0 0 7px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .tile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:600}
  .tile .big{font-size:23px;font-weight:680;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile .big small{font-size:13px;color:var(--dim);font-weight:500}
  .bar{height:7px;border-radius:5px;background:#0a0e14;margin-top:9px;overflow:hidden;border:1px solid var(--border)}
  .bar>span{display:block;height:100%;border-radius:5px;transition:width .5s ease}
  .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)} .muted{color:var(--dim)}

  h2.section{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);
    margin:22px 0 11px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 16px;
    border-left:3px solid var(--faint)}
  .card.working{border-left-color:var(--green)}
  .card.waiting{border-left-color:var(--amber)}
  .card.idle{border-left-color:var(--faint);opacity:.72}
  .chead{display:flex;align-items:center;gap:9px}
  .chead .title{font-weight:650;font-size:15px}
  .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    padding:3px 8px;border-radius:20px;white-space:nowrap}
  .badge.working{background:rgba(63,185,80,.16);color:var(--green)}
  .badge.waiting{background:rgba(210,153,34,.16);color:var(--amber)}
  .badge.idle{background:rgba(139,152,165,.13);color:var(--dim)}
  .meta{color:var(--dim);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:1px 7px;
    font-family:var(--mono);font-size:11px;color:var(--dim)}
  .said{margin:11px 0 4px;font-size:12.5px;color:#c9d4e0;background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:66px;overflow:hidden}
  .prog{margin-top:12px}
  .prog .plab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .tasks{margin-top:9px;display:flex;flex-direction:column;gap:3px;max-height:172px;overflow:auto}
  .task{display:flex;gap:7px;align-items:baseline;font-size:12.5px}
  .task .ic{width:13px;text-align:center;flex:none}
  .task.completed{color:var(--faint)} .task.completed .tx{text-decoration:line-through}
  .task.in_progress{color:var(--fg);font-weight:600}
  .task.in_progress .ic{color:var(--amber)}
  .task.completed .ic{color:var(--green)}
  .task.pending .ic{color:var(--faint)}
  .feed{margin-top:12px;border-top:1px solid var(--border);padding-top:9px;
    display:flex;flex-direction:column;gap:4px;max-height:190px;overflow:auto}
  .fitem{display:flex;gap:9px;font-size:12px;align-items:baseline}
  .fitem .ft{color:var(--faint);font-family:var(--mono);font-size:11px;flex:none;width:42px;text-align:right}
  .fitem .fl{color:#c2ccd6}
  .fitem .tg{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
  .tool-Bash{color:var(--blue)} .tool-Edit,.tool-Write{color:var(--purple)}
  .tool-TaskUpdate,.tool-TaskCreate{color:var(--amber)} .tool-AskUserQuestion{color:var(--green)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:3px 4px;border-bottom:1px solid var(--border)}
  td.r{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--dim)}
  .q{font-family:var(--mono);font-size:12px}
  .empty{color:var(--faint);font-size:12.5px;padding:6px 2px}

  /* process monitor */
  .ptools{display:flex;gap:9px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .ptools>span{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
  #pfilter{background:#0a0e14;border:1px solid var(--border);border-radius:7px;color:var(--fg);
    padding:6px 11px;font-size:12.5px;min-width:230px;flex:1;font-family:var(--mono)}
  #pfilter:focus{outline:none;border-color:var(--blue)}
  .sb{background:var(--panel2);border:1px solid var(--border);color:var(--dim);border-radius:6px;
    padding:5px 11px;font-size:11.5px;cursor:pointer;font-weight:600}
  .sb.on{color:var(--fg);border-color:var(--blue);background:rgba(88,166,255,.12)}
  .ptable{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px}
  table.ptab{width:100%;border-collapse:collapse;font-size:12px}
  table.ptab thead th{position:sticky;top:0;z-index:1;background:var(--panel2);text-align:left;
    padding:7px 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);
    border-bottom:1px solid var(--border)}
  table.ptab td{padding:3px 9px;border-bottom:1px solid #1b222b;font-family:var(--mono);white-space:nowrap}
  table.ptab tr:hover td{background:#1a212b}
  td.cmd{overflow:hidden;text-overflow:ellipsis;max-width:560px;color:#c2ccd6}
  td.hot{color:var(--amber);font-weight:700}
  td.bigrss{color:var(--red);font-weight:700}
  tr.mine td.cmd{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🖥 Claude Sessions &amp; RAG Monitor</h1>
    <span class="sub" id="proj"></span>
    <span class="live"><span class="dot" id="dot"></span><span id="upd">connecting…</span></span>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2 class="section">Recent legal_search latencies</h2>
  <div class="tile"><table id="queries"></table></div>

  <h2 class="section">All processes <span class="muted" id="procount"></span></h2>
  <div class="tile">
    <div class="ptools">
      <input id="pfilter" placeholder="filter… e.g. python, ingest, mcp, bash, qdrant, chrome">
      <span>sort</span>
      <button class="sb on" data-k="rss_mb">MEM</button>
      <button class="sb" data-k="cpu">CPU</button>
      <button class="sb" data-k="pid">PID</button>
    </div>
    <div class="ptable">
      <table class="ptab">
        <thead><tr>
          <th>PID</th><th>PPID</th><th class="r">CPU%</th><th class="r">MEM</th>
          <th>UPTIME</th><th>COMMAND</th>
        </tr></thead>
        <tbody id="proctable"></tbody>
      </table>
    </div>
  </div>

  <h2 class="section" id="sesshdr">Sessions</h2>
  <div class="grid" id="sessions"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s??'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function ago(sec){
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.floor(sec/60)+'m '+(sec%60)+'s';
  const h=Math.floor(sec/3600); return h+'h '+Math.floor((sec%3600)/60)+'m';
}
function relTs(iso){
  if(!iso) return '';
  const s=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/1000));
  return s<60?s+'s':(s<3600?Math.floor(s/60)+'m':Math.floor(s/3600)+'h');
}
function cls(pct){ return pct>=90?'bad':pct>=70?'warn':'ok'; }
function barcolor(pct){ return pct>=90?'var(--red)':pct>=70?'var(--amber)':'var(--green)'; }

function tile(lab, big, sub, pct){
  let bar='';
  if(pct!=null) bar=`<div class="bar"><span style="width:${Math.min(100,pct)}%;background:${barcolor(pct)}"></span></div>`;
  return `<div class="tile"><div class="lab">${lab}</div>
    <div class="big ${pct!=null?cls(pct):''}">${big}${sub?` <small>${sub}</small>`:''}</div>${bar}</div>`;
}

function render(s){
  $('proj').textContent = '· '+(s.projShort||'');
  $('upd').textContent = 'updated '+s.now+' · every 3s';
  $('dot').classList.remove('off');

  const sy=s.system, rag=s.rag, pod=rag.pod;
  const podTxt = pod.up ? `<span class="ok">● up</span>` : `<span class="bad">● down</span>`;
  const podSub = pod.up ? (pod.device||'') : 'CPU / RRF fallback';
  $('tiles').innerHTML =
    tile('RAM', sy.ram_used_gb+'<small>/'+sy.ram_total_gb+' GB</small>', sy.ram_pct+'%', sy.ram_pct) +
    tile('Swap', sy.swap_used_gb+'<small>/'+sy.swap_total_gb+' GB</small>', sy.swap_pct+'%', sy.swap_pct) +
    tile('Load (1m)', sy.load, 'cores busy', null) +
    tile('GPU rerank pod', podTxt, podSub, null) +
    tile('MCP servers', rag.mcp_count, (rag.mcp_rss_gb||0)+' GB · '+(rag.mcp_cpu||0)+'% cpu', null) +
    tile('Qdrant', (rag.qdrant_gb!=null?rag.qdrant_gb:'–'), 'GB resident', null);

  lastProcs = s.processes || [];
  renderProcs();

  $('queries').innerHTML = (rag.queries||[]).length ? rag.queries.map(q=>{
    const c = q.latency_s>60?'bad':q.latency_s>10?'warn':'ok';
    return `<tr><td class="q">${esc(q.q)}</td><td class="r ${c}">${q.latency_s}s</td>
      <td class="r">${esc(q.route||'')}</td></tr>`;
  }).join('') : '<tr><td class="empty">no queries logged yet</td></tr>';

  const sess = s.sessions||[];
  $('sesshdr').textContent = `Sessions (${sess.filter(x=>x.status!=='idle').length} active)`;
  $('sessions').innerHTML = sess.map(card).join('') || '<div class="empty">no recent sessions</div>';
}

function card(s){
  const badge = {working:'working',waiting:'waiting for you',idle:'idle'}[s.status]||s.status;
  const tasks = (s.tasks||[]).map(t=>{
    const ic = t.status==='completed'?'✓':t.status==='in_progress'?'▶':'○';
    return `<div class="task ${t.status}"><span class="ic">${ic}</span>
      <span class="tx">${esc(t.subject)}</span></div>`;
  }).join('');
  const prog = s.task_total ? `<div class="prog">
      <div class="plab"><span>To-do</span><span>${s.task_done}/${s.task_total} done</span></div>
      <div class="bar"><span style="width:${Math.round(100*s.task_done/s.task_total)}%;background:var(--green)"></span></div>
      <div class="tasks">${tasks}</div></div>` : '';
  const feed = (s.feed||[]).map(f=>
    `<div class="fitem"><span class="ft">${relTs(f.t)}</span>
      <span class="fl">${esc(f.label)}</span>
      <span class="tg tool-${esc(f.tool)}">${esc(f.tool)}</span></div>`).join('')
    || '<div class="empty">no tool activity</div>';
  const said = s.last_text ? `<div class="said">💬 ${esc(s.last_text)}</div>` : '';
  return `<div class="card ${s.status}">
    <div class="chead">
      <span class="title">${esc(s.slug)}</span>
      <span class="badge ${s.status}">${badge}</span>
    </div>
    <div class="meta">
      <span class="chip">${esc(s.short)}</span>
      <span class="chip">⎇ ${esc(s.branch)}</span>
      <span>⏱ ${ago(s.age_s)} ago</span>
      <span>${s.messages} msgs</span>
    </div>
    ${said}${prog}
    <div class="feed">${feed}</div>
  </div>`;
}

let lastProcs=[], procSort='rss_mb', procFilter='';
function renderProcs(){
  const cont=document.querySelector('.ptable'); const sc=cont?cont.scrollTop:0;
  let rows=lastProcs.slice();
  if(procFilter){ const f=procFilter.toLowerCase();
    rows=rows.filter(p=>(p.cmd||'').toLowerCase().includes(f)); }
  rows.sort((a,b)=> procSort==='pid' ? a.pid-b.pid : b[procSort]-a[procSort]);
  const tot=lastProcs.reduce((s,p)=>s+p.rss_mb,0);
  $('procount').textContent = `— ${rows.length}/${lastProcs.length} shown · ${(tot/1024).toFixed(1)} GB total RSS`;
  $('proctable').innerHTML = rows.map(p=>{
    const cpuC=p.cpu>=50?'hot':'', rssC=p.rss_mb>=1024?'bigrss':'';
    const mem=p.rss_mb>=1024?(p.rss_mb/1024).toFixed(2)+'G':p.rss_mb+'M';
    const mine=/ingest|qdrant|runpod|session_monitor|eval\.evaluate/.test(p.cmd||'')?'mine':'';
    return `<tr class="${mine}"><td>${p.pid}</td><td class="muted">${p.ppid||''}</td>`+
      `<td class="r ${cpuC}">${p.cpu.toFixed(0)}</td><td class="r ${rssC}">${mem}</td>`+
      `<td class="muted">${esc(p.etime||'')}</td>`+
      `<td class="cmd" title="${esc(p.cmd)}">${esc(p.cmd)}</td></tr>`;
  }).join('') || '<tr><td colspan="6" class="empty">no matching processes</td></tr>';
  if(cont) cont.scrollTop=sc;
}
$('pfilter').addEventListener('input', e=>{ procFilter=e.target.value; renderProcs(); });
document.querySelectorAll('.sb').forEach(b=>b.addEventListener('click',()=>{
  procSort=b.dataset.k;
  document.querySelectorAll('.sb').forEach(x=>x.classList.toggle('on', x===b));
  renderProcs();
}));

async function poll(){
  try{
    const r = await fetch('/api/state',{cache:'no-store'});
    const s = await r.json();
    if(s.error){ throw new Error(s.error); }
    s.projShort = 'Georgia-Legal-Search';
    render(s);
  }catch(e){
    $('dot').classList.add('off');
    $('upd').textContent = 'disconnected — is session_monitor.py running?';
  }
}
poll(); setInterval(poll, 3000);
</script>
</body>
</html>
